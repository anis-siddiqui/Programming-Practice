<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h2>Event Regestration</h2>
    <form action="https://www.youtube.com">
        <label for="name">Name: </label>
        <br>
        <input type="text" id="name">
        <br>
        <br>
        <label for="email">Email: </label>
        <br>
        <input type="email" id="email">
        <br>
        <br>
        <label for="phoneNo">Phone: </label>
        <br>
        <input type="tel" id="phoneNo">
        <br>
        <br>
        <label for="occupationType">Occupation: </label>
        <br>
        <select id="occupationType">
            <option value="student">Student</option>
            <option value="professional">professional</option>
            <option value="others">Others</option>
        </select>
        <br>
        <br>
        <fieldset>
            <legend>Field of interest: </legend>
            <input type="checkbox" name="checkbox" id="checkbox1">
            <br>
            <label for="checkbox1">HTML</label>
            <br>
            <input type="checkbox" name="checkbox" id="checkbox2">
            <br>
            <label for="checkbox2">CSS</label>
            <br>
            <input type="checkbox" name="checkbox" id="checkbox3">
            <br>
            <label for="checkbox3">JAVASCRIPT</label>
        </fieldset>
        <br>
        <label for="textarea">Comments: </label>
        <br>
        <textarea id="textarea" rows="10" cols="30"></textarea>
        <input type="submit" value="Register">
    </form>
</body>
</html>
